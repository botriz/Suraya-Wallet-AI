name: Wallet security and container checks

on:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
      - "security/**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: wallet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax and safety tests
        run: npm run check
      - name: Build container
        run: docker build -t suraya-wallet-ai:ci .

      - name: Validate hardened Compose configuration
        run: docker compose config --quiet
